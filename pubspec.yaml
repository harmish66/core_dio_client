name: core_dio_client
description: A production-ready Flutter and Dart HTTP client built on Dio with auto-retry, auth token refresh, structured logging, cancel tokens, and progress tracking for downloads and uploads.
homepage: https://github.com/harmish66/core_dio_client
repository: https://github.com/harmish66/core_dio_client
issue_tracker: https://github.com/harmish66/core_dio_client/issues

version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.1
  meta: ^1.11.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
